[package]
name = "datapipe"
version = "0.1.9"
edition = "2024"
authors = ["Richard Scott McNew"]
description = "Stream data from here to there"
license = "AGPL-3.0-only"
repository = "https://github.com/rmcnew/datapipe"
documentation = "https://docs.rs/datapipe"


[lib]
crate-type = ["lib"]

[dependencies]
bytes = { version = "1", features = ["serde"] }
chacha20poly1305 = { version = "0.10", features = ["alloc", "stream"] }
clap = { version = "4", features = ["derive"] }
log = { version = "0.4", features = ["serde"] }
log4rs = "1"
rand = "0.10"
rcgen = { version = "0.14", features = ["crypto", "pem"] }
reqwest = { version = "0.12", features = ["charset", "gzip", "http2", "json", "rustls-tls"], default-features = false }
rustls = { version = "0.23", features = ["ring", "logging", "std", "tls12"], default-features = false }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml = "1"
url = { version = "2", features = ["serde"] }
webpki-roots = "1"

# Optional GUI dependencies
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wayland", "x11", "glow"], optional = true }
egui = { version = "0.36", optional = true }
rfd = { version = "0.17", optional = true }

[features]
default = []
gui = ["dep:eframe", "dep:egui", "dep:rfd"]

[[bin]]
name = "datapipe"
path = "src/bin/datapipe.rs"

[[bin]]
name = "datapipe-gui"
path = "src/bin/datapipe_gui.rs"
required-features = ["gui"]
